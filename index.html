<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03010a">
<meta name="description" content="Un jardín de flores en el universo: un viaje en 3D con estrellas, un sol de pétalos y unas palabras para el 21 de septiembre.">
<title>21 de septiembre</title>
<meta property="og:type" content="website">
<meta property="og:title" content="21 de septiembre">
<meta property="og:description" content="Un jardín de flores en el universo: un viaje en 3D con estrellas, un sol de pétalos y unas palabras para el 21 de septiembre.">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Bienvenida -->
<div class="bienvenida" id="bienvenida">
  <div class="bienvenida-card">
    <p class="infinito" aria-hidden="true">∞</p>
    <h1 class="titulo-bienvenida">21 de septiembre</h1>
    <p class="subtitulo-bienvenida">un jardín de flores en el universo</p>
    <p class="linea-nombre" id="linea-nombre">para ti</p>
    <button class="btn-entrar" id="btn-entrar" type="button">
      <span>Entrar al universo</span>
      <span aria-hidden="true">🌸</span>
    </button>
  </div>
</div>

<!-- Experiencia principal -->
<div class="experiencia oculto" id="experiencia">
  <canvas id="universo" aria-hidden="true"></canvas>
  <div class="fondo-simple" aria-hidden="true"></div>

  <main class="verso">
    <div class="verso-contenido">
      <p class="frase" id="frase" aria-hidden="true"></p>
      <p class="sr-only" id="frase-sr" aria-live="polite"></p>
      <div class="foot"><span class="sig" id="firma">Para ti</span></div>
    </div>
  </main>

  <p class="hint" id="hint">toca el cielo y pide un deseo</p>

  <audio id="musica" src="assets/musica.mp3" loop preload="auto" playsinline></audio>
  <button class="sonido off" id="sonido" type="button" aria-pressed="false" aria-label="Activar la música">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path class="cono" d="M4 9h3.6L12 5v14l-4.4-4H4z"/>
      <g class="ondas" fill="none" stroke-linecap="round">
        <path d="M15.6 9.4a3.6 3.6 0 0 1 0 5.2"/>
        <path d="M18.1 7a7 7 0 0 1 0 10"/>
      </g>
      <path class="tacha" d="M16 9l5 6M21 9l-5 6" fill="none" stroke-linecap="round"/>
    </svg>
  </button>

  <div class="bar top" aria-hidden="true"></div>
  <div class="bar bot" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <p class="titulo" id="titulo">21 de septiembre</p>
</div>

<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;margin:0;padding:24px;text-align:center;color:#f7f0ff;background:#03010a;font:italic 1.5rem Georgia,serif">21 de septiembre — hace falta JavaScript para ver el jardín.</p></noscript>

<!-- three.js, para el viaje 3D -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- Scripts clásicos (sin módulos), para que la página también abra con doble clic. El orden importa. -->
<script src="js/util.js"></script>
<script src="js/config.js"></script>
<script src="js/datos.js"></script>
<script src="js/escena.js"></script>
<script src="js/espacio.js"></script>
<script src="js/flora.js"></script>
<script src="js/viaje.js"></script>
<script src="js/interaccion.js"></script>
<script src="js/frases.js"></script>
<script src="js/audio.js"></script>
<script src="js/intro.js"></script>
<script src="js/main.js"></script>
</body>
</html>
